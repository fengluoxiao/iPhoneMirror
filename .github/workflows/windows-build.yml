name: Windows x64 build validation
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Windows x64: verify localization, build, test and publish | PR #{0} | {1} -> {2}', github.event.pull_request.number, github.head_ref, github.base_ref)
      || format('Windows x64: verify localization, build, test and publish | {0} | {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify Simplified Chinese and English resources
        shell: pwsh
        run: ./scripts/verify_localization.ps1

      - name: Build Release, run tests, and publish Windows x64 output
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Bundle go-ios for WDA auto-launch
        shell: pwsh
        run: |
          $destination = "outputs/iPhoneMirror/tools/go-ios"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest `
            "https://github.com/danielpaulus/go-ios/releases/download/v1.3.2/go-ios-win.zip" `
            -OutFile go-ios.zip
          Expand-Archive go-ios.zip -DestinationPath go-ios-tmp
          $exe = Get-ChildItem go-ios-tmp -Recurse -Filter ios.exe |
            Select-Object -First 1
          if (-not $exe) { throw "ios.exe not found in go-ios release" }
          Copy-Item $exe.FullName "$destination/ios.exe"
          Invoke-WebRequest `
            "https://raw.githubusercontent.com/danielpaulus/go-ios/v1.3.2/LICENSE" `
            -OutFile "$destination/LICENSE"
          Get-ChildItem $destination | Select-Object Name, Length

      - name: Upload portable build for manual verification
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMirror-win-x64-dev
          path: outputs/iPhoneMirror/
          retention-days: 7
          if-no-files-found: error
